services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      target: runner
    image: mionmu/student-helper-frontend:latest
    container_name: student-helper-frontend
    profiles: ["frontend","all"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - student-helper-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://$(hostname -i):3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    image: mionmu/student-helper-api-gateway:latest
    container_name: student-helper-api-gateway
    profiles: ["backend","all"]
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - env/.env.api-gateway
    networks:
      - student-helper-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cdn-service:
